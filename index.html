<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Executive Chart Studio</title>
    <meta
      name="description"
      content="Zero-backend client-side data visualization studio with live SVG slide previews and native editable PowerPoint vector export."
    />
    <meta property="og:title" content="Executive Chart Studio" />
    <meta
      property="og:description"
      content="Zero-backend client-side data visualization studio with live SVG slide previews and native editable PowerPoint vector export."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F3F4F6] text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Shared chart-studio footer -->
    <style>
      .csf {
        --csf-bg: #FFFAF5;
        --csf-ink: #3A3454;
        --csf-border: #3A3454;
        --csf-tint-waffle: #FFDCCB;
        --csf-dot-waffle: #D9694A;
        --csf-tint-bars: #CFEBDD;
        --csf-dot-bars: #3B9576;
        --csf-tint-sankey: #DDD5F3;
        --csf-dot-sankey: #7260B6;
        --csf-tint-all: #EFEAF6;
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
        background: var(--csf-bg);
        color: var(--csf-ink);
        border-top: 1.5px solid var(--csf-border);
        font-family: Figtree, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        text-align: center;
      }

      .csf *,
      .csf *::before,
      .csf *::after {
        box-sizing: border-box;
      }

      .csf .csf-inner {
        max-width: 820px;
        margin: 0 auto;
      }

      .csf .csf-title {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--csf-ink);
      }

      .csf .csf-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .csf .csf-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border: 1.5px solid var(--csf-border);
        border-radius: 9999px;
        background: transparent;
        color: var(--csf-ink);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.25;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
      }

      .csf .csf-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .csf .csf-pill[data-tool="waffle"] .csf-dot {
        background: var(--csf-dot-waffle);
      }

      .csf .csf-pill[data-tool="bars"] .csf-dot {
        background: var(--csf-dot-bars);
      }

      .csf .csf-pill[data-tool="sankey"] .csf-dot {
        background: var(--csf-dot-sankey);
      }

      .csf .csf-pill[data-tool="waffle"]:hover,
      .csf .csf-pill[data-tool="waffle"][aria-current="page"] {
        background: var(--csf-tint-waffle);
      }

      .csf .csf-pill[data-tool="bars"]:hover,
      .csf .csf-pill[data-tool="bars"][aria-current="page"] {
        background: var(--csf-tint-bars);
      }

      .csf .csf-pill[data-tool="sankey"]:hover,
      .csf .csf-pill[data-tool="sankey"][aria-current="page"] {
        background: var(--csf-tint-sankey);
      }

      .csf .csf-pill[data-tool="all"]:hover,
      .csf .csf-pill[data-tool="all"][aria-current="page"] {
        background: var(--csf-tint-all);
      }

      .csf .csf-pill:hover {
        transform: translateY(-2px);
      }

      .csf .csf-pill:focus-visible {
        outline: 2.5px solid var(--csf-ink);
        outline-offset: 2px;
      }

      .csf .csf-pill[aria-current="page"] {
        font-weight: 600;
        cursor: default;
        pointer-events: none;
        transform: none;
      }

      @media (prefers-color-scheme: dark) {
        .csf {
          --csf-bg: #1F1C2B;
          --csf-ink: #F3EEF9;
          --csf-border: rgba(243, 238, 249, 0.38);
          --csf-tint-waffle: #4A2E2A;
          --csf-dot-waffle: #FFB494;
          --csf-tint-bars: #243F38;
          --csf-dot-bars: #8EE0C0;
          --csf-tint-sankey: #362E52;
          --csf-dot-sankey: #C4B5F7;
          --csf-tint-all: #2E2940;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .csf .csf-pill {
          transition: none;
        }

        .csf .csf-pill:hover {
          transform: none;
        }
      }
    </style>

    <footer class="csf" aria-label="More chart makers from the studio">
      <div class="csf-inner">
        <p class="csf-title">More chart makers from the studio</p>
        <nav class="csf-nav" aria-label="Chart studio tools">
          <a class="csf-pill" data-tool="waffle" href="https://nirmalya-panigrahi.github.io/Waffle-Chart-Studio/">
            <span class="csf-dot" aria-hidden="true"></span>
            <span>Waffle Chart Studio</span>
          </a>
          <a class="csf-pill" data-tool="bars" href="https://nirmalya-panigrahi.github.io/Exec-Bar-Charts/">
            <span class="csf-dot" aria-hidden="true"></span>
            <span>Exec Bar Charts</span>
          </a>
          <a class="csf-pill" data-tool="sankey" href="https://nirmalya-panigrahi.github.io/Sankey-Chart-Studio/">
            <span class="csf-dot" aria-hidden="true"></span>
            <span>Sankey Chart Studio</span>
          </a>
          <a class="csf-pill" data-tool="all" href="https://nirmalya-panigrahi.github.io/Executive-Charts/">
            <span>All chart makers →</span>
          </a>
        </nav>
      </div>
    </footer>

    <script>
      (function () {
        var norm = function (p) {
          return p.replace(/\/index\.html?$/i, '').replace(/\/+$/, '') || '/';
        };
        var here = norm(location.pathname);
        var links = document.querySelectorAll('.csf .csf-pill');
        for (var i = 0; i < links.length; i++) {
          var a = links[i];
          if (norm(a.pathname) === here && (here !== '/' || a.hostname === location.hostname)) {
            a.setAttribute('aria-current', 'page');
            a.removeAttribute('href');
          }
        }
      })();
    </script>
  </body>
</html>
